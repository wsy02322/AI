<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Image Studio</title>
  <link rel="stylesheet" href="/static/studio.css?v=3" />
</head>
<body class="login-body">
  <main class="login-card">
    <p class="eyebrow">image.micropigeon.com</p>
    <h1>Image Studio</h1>
    <p class="sub">Sign in with your Open WebUI account. The password is only sent to sign-in, not stored in the library.</p>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/api/login">
      <label>Username
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
