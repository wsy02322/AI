<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI · Demo Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <div class="brand">
          <span class="brand__dot" aria-hidden="true"></span>
          <h1 class="brand__title">AI Demo</h1>
        </div>
        <p class="app__subtitle">
          Offline assistant · verifies the dev environment end to end
        </p>
      </header>

      <section id="messages" class="messages" aria-live="polite">
        <div class="message message--bot">
          <div class="message__bubble">
            Hi! Try <code>reverse hello world</code>, <code>count words in this sentence</code>, or just say hello.
          </div>
        </div>
      </section>

      <form id="composer" class="composer" autocomplete="off">
        <input
          id="input"
          class="composer__input"
          name="message"
          placeholder="Send a message…"
          aria-label="Message"
          required
        />
        <button id="send" class="composer__send" type="submit">Send</button>
      </form>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
